# CI/CD: mỗi lần push / mở pull request lên main
#   1) job test  : cài đúng phiên bản trong package-lock.json, chạy toàn bộ test (12 test case BT3 + hồi quy),
#                  chạy lại db:setup lần 2 (C8) và kiểm lỗ hổng phụ thuộc (checklist bảo mật mục 7)
#   2) job deploy: CHỈ khi push lên main và job test đã PASS -> gọi Render Deploy Hook để triển khai đúng commit
#                  vừa kiểm, rồi chờ tới khi /health trên Render báo đúng commit đó (Deployment Guide §8, TD-39)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Hai lần push sát nhau: chỉ deploy bản mới nhất
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'     # node:sqlite cần Node >= 22.13 (TD-12); trùng phiên bản ảnh Docker
          cache: npm

      - name: Cài phụ thuộc theo package-lock.json
        run: npm ci

      - name: npm test (12 test case + hồi quy)
        run: npm test

      - name: Chạy lại migration + seed lần 2 không lỗi, không nhân đôi (C8)
        env:
          DATABASE_FILE: ./data/ci.db
          DEMO_PASSWORD: Ci-Demo-2026
        run: |
          npm run db:setup
          npm run db:setup

      - name: Kiểm lỗ hổng phụ thuộc (mức high trở lên làm đỏ build)
        run: npm audit --audit-level=high

  deploy:
    needs: test                                   # test đỏ thì KHÔNG deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}   # bí mật, đặt ở Settings → Secrets and variables → Actions
      APP_URL: https://cdtn1-phoutthavongkhanxay-l8.onrender.com
    steps:
      - name: Gọi Render Deploy Hook cho đúng commit vừa kiểm
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Chưa có secret RENDER_DEPLOY_HOOK_URL – bỏ qua bước deploy"
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Không in URL hook ra log (là bí mật); chỉ in mã HTTP
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          echo "Render deploy hook -> HTTP $code"
          case "$code" in 200|201|202) ;; *) echo "::error::Render từ chối deploy (HTTP $code)"; exit 1 ;; esac

      - name: Chờ bản mới chạy trên Render (/health báo đúng commit)
        if: env.SKIP_DEPLOY != '1'
        run: |
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 40); do                # tối đa ~13 phút (build Docker + khởi động)
            body=$(curl -s --max-time 20 "$APP_URL/health" || true)
            echo "lần $i: $body"
            if echo "$body" | grep -q "\"commit\":\"$want\"" && echo "$body" | grep -q '"db":"up"'; then
              echo "::notice::Đã deploy commit $want lên $APP_URL"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Hết thời gian chờ: $APP_URL/health chưa báo commit $want"
          exit 1
