<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – Smart CRM Mekong Mobile</title>
  <link rel="stylesheet" href="assets/giao-dien.css">
</head>
<body class="trang-dang-nhap">
  <div class="hop-dang-nhap">
    <div class="hop-dang-nhap__dau">
      <strong>MEKONG MOBILE</strong>
      <span>Smart CRM · Khảo sát CSAT</span>
    </div>
    <form id="form-dang-nhap" novalidate>
      <div id="trang-thai" data-state="idle"></div>
      <div class="truong" style="margin-top:12px">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="truong">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="nut-do" type="submit" data-submit style="width:100%; padding:10px">Đăng nhập</button>
      <p class="khoi__ghi-chu" style="margin-top:14px">
        Tài khoản demo: <b>bgd</b>, <b>quanly.tt01</b>, <b>marketing</b> – mật khẩu xem trong tệp
        <code>.env</code> (<code>DEMO_PASSWORD</code>).
      </p>
      <p style="margin:6px 0 0"><a href="khao-sat.html">Khách hàng trả lời khảo sát →</a></p>
    </form>
  </div>
  <script type="module" src="pages/dang-nhap.page.mjs"></script>
</body>
</html>
